[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "tandemx"
version = "0.1.0"
description = "Read-first, assembly-aware tandem repeat discovery and abundance analysis."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "TandemX developers" }
]
dependencies = ["matplotlib>=3.7", "pyyaml>=6"]

[project.optional-dependencies]
test = [
  "pytest>=7",
  "pyyaml>=6",
  "edlib==1.3.9.post1"
]
benchmark = ["pyyaml>=6", "edlib==1.3.9.post1"]

[project.scripts]
tandemx = "tandemx.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.maturin]
manifest-path = "rust-core/Cargo.toml"
python-source = "."
module-name = "tandemx._rust_core"
features = ["pyo3/extension-module"]
