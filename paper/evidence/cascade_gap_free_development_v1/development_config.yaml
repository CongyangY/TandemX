benchmark_id: cascade_speed_profile_development_v1
repetitions: 3
timeout_seconds: 30
period_range: [30, 1000]
minimum_span_bp: 100
minimum_iou: 0.5
seeds:
  development: [1201]
  validation: [2201]
  heldout: [3201, 3202, 3203]
tools:
  tandemx: tandemx
  tidehunter: .conda-benchmark/bin/TideHunter
tool_versions:
  tidehunter: 1.5.5
scenarios:
  - {name: clean_60, period: 60, copies: 30}
  - {name: clean_171, period: 171, copies: 12}
  - {name: clean_421, period: 421, copies: 8}
  - {name: clean_729, period: 729, copies: 6}
  - {name: substitution_1pct, substitution_rate: 0.01}
  - {name: substitution_5pct, substitution_rate: 0.05}
  - {name: indel_01pct, insertion_rate: 0.0005, deletion_rate: 0.0005}
  - {name: indel_1pct, insertion_rate: 0.005, deletion_rate: 0.005}
  - {name: indel_4pct, insertion_rate: 0.02, deletion_rate: 0.02}
  - {name: divergent_units, unit_divergence: 0.10}
  - {name: related_families, related_families: true}
  - {name: short_arrays, copies: 3}
  - {name: two_arrays, copies: 8, arrays_per_read: 2}
  - {name: dispersed_control, positive_fraction: 0.0, negative_kind: dispersed}
  - {name: at_rich_control, positive_fraction: 0.0, negative_kind: at_rich}
  - {name: low_complexity_control, positive_fraction: 0.0, negative_kind: low_complexity}
discovery_method: cascade
purpose: development_only_hotspot_diagnosis
warning: not_frozen_validation;seed_1201_is_development_after_first_run;profile_before_tuning
